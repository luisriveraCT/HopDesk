name: Avisos semanales (D)

# The weekly Panorama emails and the monthly archive (scripts/avisos_job.R).
#
# Two ways to start (the schedule since the first real Monday was reviewed
# and approved, 2026-11-17):
#   - on schedule (UTC; Mexico has no daylight saving time since 2022):
#       lunes    Monday 8:00 Mexico      cron "0 14 * * 1"
#       viernes  Friday 17:00 Mexico     cron "0 23 * * 5"
#       archivo  Saturday 5:30 UTC       cron "30 5 * * 6"
#     A scheduled run has no inputs: its mode comes from the cron that
#     started it, and it SENDS (it is the real weekly email). GitHub may
#     start a scheduled run late, or skip it under load.
#   - by hand (workflow_dispatch), where test mode is the default:
#     "prueba" sends nothing and leaves each email's HTML in
#     <cliente>/avisos/prueba/ for review.
# The job never resends what it already sent (correos_enviados.rds), so a
# manual run on the same day as a scheduled one does not duplicate it.
#
# THE LOG IS PUBLIC. The job prints only "evento=<count>" lines. Nothing here
# echoes a variable, and inputs reach the script through env, never pasted
# into a command line. AWS is reached only through the OIDC role, which may
# read the bucket and write only <cliente>/avisos/*. No stored AWS keys.
# tests/test_avisos_workflow.R guards all of this.

on:
  schedule:
    - cron: "0 14 * * 1"
    - cron: "0 23 * * 5"
    - cron: "30 5 * * 6"
  workflow_dispatch:
    inputs:
      modo:
        description: "lunes, viernes o archivo"
        required: true
        type: choice
        options: [lunes, viernes, archivo]
      prueba:
        description: "Modo prueba: no envía nada, deja el HTML en avisos/prueba/"
        required: true
        type: boolean
        default: true
      fecha:
        description: "Opcional, AAAA-MM-DD: el día con que corre (por defecto, hoy en México)"
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    environment: produccion
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tibble
            any::tidyr
            any::stringr
            any::lubridate
            any::jsonlite
            any::aws.s3
            any::httr
            any::uuid
            any::htmltools
            any::shiny
            any::digest
            any::openssl

      - name: AWS role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::496973234684:role/hopdesk-avisos-github
          role-session-name: hopdesk-avisos
          aws-region: us-east-1

      - name: Run the job
        env:
          # By hand: the inputs. On schedule: the mode of the cron that
          # started it, and a real send (prueba false).
          AVISOS_MODO: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 14 * * 1' && 'lunes' || github.event.schedule == '0 23 * * 5' && 'viernes' || github.event.schedule == '30 5 * * 6' && 'archivo' || 'desconocido') || inputs.modo }}
          AVISOS_PRUEBA: ${{ github.event_name == 'schedule' && 'false' || inputs.prueba }}
          AVISOS_FECHA: ${{ inputs.fecha }}
          S3_BUCKET: antiguedad-rds-prod
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          HOPDESK_APP_URL: ${{ vars.HOPDESK_APP_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_FROM_NAME: ${{ secrets.RESEND_FROM_NAME }}
        run: Rscript --vanilla scripts/avisos_job.R
