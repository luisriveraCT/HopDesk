name: Avisos semanales (D)
# T80: the run's name says its mode and whether it sent for real. The AWS
# trigger (infra/avisos_disparo/) reads it from the public API to know that
# this week's email already went out.
run-name: avisos ${{ github.event_name == 'schedule' && (contains(fromJSON('["17 14 * * 1","47 15 * * 1","23 18 * * 1"]'), github.event.schedule) && 'lunes' || contains(fromJSON('["17 23 * * 5","41 23 * * 5"]'), github.event.schedule) && 'viernes' || contains(fromJSON('["37 5 * * 6","13 9 * * 6"]'), github.event.schedule) && 'archivo' || 'desconocido') || inputs.modo }} ${{ (github.event_name == 'schedule' || inputs.prueba == false) && 'real' || 'prueba' }}

# The weekly Panorama emails and the monthly archive (scripts/avisos_job.R).
#
# Three ways to start:
#   - the main one (T80): AWS EventBridge Scheduler, Mexico time, starts it
#     by workflow_dispatch with prueba=false at the email's hour and twice
#     after (infra/avisos_disparo/). GitHub's cron came 4.7 to 11.5 hours
#     late (2026-11-20..23); a dispatched run starts in seconds.
#   - on schedule, as a backup if AWS fails (UTC; Mexico has no daylight
#     saving time since 2022), off the busy :00/:30 minutes:
#       lunes    Monday 8:17, 9:47, 12:23 Mexico    "17 14 * * 1" "47 15 * * 1" "23 18 * * 1"
#       viernes  Friday 17:17, 17:41 Mexico         "17 23 * * 5" "41 23 * * 5"
#       archivo  Friday 23:37, Saturday 3:13 Mexico "37 5 * * 6"  "13 9 * * 6"
#     A scheduled run has no inputs: its mode comes from the list holding
#     the cron that started it, and it SENDS (it is the real weekly email).
#     GitHub may start a scheduled run late, or skip it under load.
#   - by hand (workflow_dispatch), where test mode is the default:
#     "prueba" sends nothing and leaves each email's HTML in
#     <cliente>/avisos/prueba/ for review.
# Starting it many times is the design: the job never resends what it
# already sent (correos_enviados.rds), and a client whose real email of the
# week already reached everyone is skipped whole (job_ya_salio, T80).
#
# THE LOG IS PUBLIC. The job prints only "evento=<count>" lines. Nothing here
# echoes a variable, and inputs reach the script through env, never pasted
# into a command line. AWS is reached only through the OIDC role, which may
# read the bucket and write only <cliente>/avisos/*. No stored AWS keys.
# tests/test_avisos_workflow.R guards all of this.

on:
  schedule:
    - cron: "17 14 * * 1"
    - cron: "47 15 * * 1"
    - cron: "23 18 * * 1"
    - cron: "17 23 * * 5"
    - cron: "41 23 * * 5"
    - cron: "37 5 * * 6"
    - cron: "13 9 * * 6"
  workflow_dispatch:
    inputs:
      modo:
        description: "lunes, viernes o archivo"
        required: true
        type: choice
        options: [lunes, viernes, archivo]
      prueba:
        description: "Modo prueba: no envía nada, deja el HTML en avisos/prueba/"
        required: true
        type: boolean
        default: true
      fecha:
        description: "Opcional, AAAA-MM-DD: el día con que corre (por defecto, hoy en México)"
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: avisos
  cancel-in-progress: false

jobs:
  avisos:
    runs-on: ubuntu-latest
    environment: produccion
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::tibble
            any::tidyr
            any::stringr
            any::lubridate
            any::jsonlite
            any::aws.s3
            any::httr
            any::uuid
            any::htmltools
            any::shiny
            any::digest
            any::openssl

      - name: AWS role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::496973234684:role/hopdesk-avisos-github
          role-session-name: hopdesk-avisos
          aws-region: us-east-1

      - name: Run the job
        env:
          # By hand or by the AWS trigger: the inputs. On schedule: the mode
          # of the list holding the cron that started it, and a real send.
          AVISOS_MODO: ${{ github.event_name == 'schedule' && (contains(fromJSON('["17 14 * * 1","47 15 * * 1","23 18 * * 1"]'), github.event.schedule) && 'lunes' || contains(fromJSON('["17 23 * * 5","41 23 * * 5"]'), github.event.schedule) && 'viernes' || contains(fromJSON('["37 5 * * 6","13 9 * * 6"]'), github.event.schedule) && 'archivo' || 'desconocido') || inputs.modo }}
          AVISOS_PRUEBA: ${{ github.event_name == 'schedule' && 'false' || inputs.prueba }}
          AVISOS_FECHA: ${{ inputs.fecha }}
          S3_BUCKET: antiguedad-rds-prod
          AWS_REGION: us-east-1
          AWS_DEFAULT_REGION: us-east-1
          HOPDESK_APP_URL: ${{ vars.HOPDESK_APP_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_FROM_NAME: ${{ secrets.RESEND_FROM_NAME }}
        run: Rscript --vanilla scripts/avisos_job.R
